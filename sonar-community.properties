# Shared SonarQube and SonarScanner settings for the local Community Build.
sonar.host.url=http://localhost:9000
sonar.sources=.
sonar.scm.disabled=true

# Proxy settings (SonarScanner CLI 6.0+). Keep credentials out of this file;
# use SONAR_SCANNER_PROXY_USER and SONAR_SCANNER_PROXY_PASSWORD instead.
# sonar.scanner.proxyHost=proxy.example.local
# sonar.scanner.proxyPort=8080
